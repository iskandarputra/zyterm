name: zyterm CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: linux / ${{ matrix.cc }} / ${{ matrix.sanitizer }}
    runs-on: ubuntu-latest
    # Cap each job to 15 minutes. Local clean+build+test is < 90s; a
    # 15-minute ceiling lets a slow hosted runner finish honestly but
    # catches the kind of hang (blocked stdin, wedged child, infinite
    # poll) we explicitly hunt for in tests.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Linux-only by design: zyterm targets Linux serial surfaces
        # (termios2 custom baud, inotify, epoll, /sys/class/tty
        # VID/PID discovery) and we don't ship macOS binaries.
        cc: [gcc, clang]
        sanitizer: ["none", "asan-ubsan"]
    env:
      CC: ${{ matrix.cc }}
      # Belt-and-braces: kill any subprocess that runs > 10 min so we
      # never burn the full job timeout on a wedged test.
      ZT_CI_STEP_TIMEOUT: 600
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 2

      - name: Install build deps
        timeout-minutes: 5
        # Inline apt-get rather than awalsh128/cache-apt-pkgs-action
        # because the latter still pulls actions/cache/restore@v4 +
        # actions/cache/save@v4 (Node 20, deprecation pending). The
        # uncached install is ~15s — acceptable on ubuntu-latest.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential socat clang-format clang cppcheck

      - name: Check formatting
        if: matrix.sanitizer == 'none' && matrix.cc == 'gcc'
        timeout-minutes: 2
        run: make format-check

      - name: Module layering check
        if: matrix.sanitizer == 'none' && matrix.cc == 'gcc'
        timeout-minutes: 2
        # Enforce the dependency chain (INVARIANTS §8): narrow per-module
        # includes + no bare up-layer externs. The compiler half of this is
        # -Werror=implicit-function-declaration in the build below.
        run: make layering-check

      - name: Build (release)
        if: matrix.sanitizer == 'none'
        timeout-minutes: 5
        run: make

      - name: Build (asan+ubsan)
        if: matrix.sanitizer == 'asan-ubsan'
        timeout-minutes: 5
        run: |
          make clean
          CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
                  -Wall -Wextra -pedantic -std=gnu11 -D_GNU_SOURCE \
                  -Iinclude -Isrc" \
          LDFLAGS="-fsanitize=address,undefined" make

      - name: Smoke test
        timeout-minutes: 2
        run: |
          timeout 30 ./zyterm --version
          timeout 30 ./zyterm --help | head -20

      - name: Unit tests (release)
        if: matrix.sanitizer == 'none'
        timeout-minutes: 5
        run: timeout 240 make test

      - name: Unit tests (asan+ubsan)
        if: matrix.sanitizer == 'asan-ubsan'
        timeout-minutes: 8
        run: |
          CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
                  -Wall -Wextra -pedantic -std=gnu11 -D_GNU_SOURCE \
                  -Iinclude -Isrc" \
          LDFLAGS="-fsanitize=address,undefined" timeout 420 make test

      - name: cppcheck
        if: matrix.sanitizer == 'none' && matrix.cc == 'gcc'
        timeout-minutes: 3
        run: make lint || true

  # ThreadSanitizer leg: the --threaded SPSC ring (loop/rx_thread.c) is the one
  # place with real concurrency (hand-rolled release/acquire atomics), and ASan
  # cannot see data races. Build the embed archive + the ring test under TSan
  # and run it — it drives a worker thread against a pipe with a concurrent
  # consumer, exactly the happens-before edges to check.
  tsan:
    name: linux / clang / thread-sanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 2
      - name: Install build deps
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential clang
      - name: Build (thread-sanitizer) + run the SPSC ring test
        timeout-minutes: 8
        env:
          TSAN: "-fsanitize=thread -fno-omit-frame-pointer"
        run: |
          make clean
          # Instrument the embed archive (contains rx_thread.c) with TSan first,
          # so tests/Makefile finds it up-to-date and won't rebuild it plain.
          CC=clang \
          CFLAGS="-O1 -g $TSAN -Wall -Wextra -pedantic -Werror=implicit-function-declaration -std=gnu11 -D_GNU_SOURCE -Iinclude -Isrc" \
          LDFLAGS="$TSAN" make zyterm_embed.a
          CC=clang \
          CFLAGS="-O1 -g $TSAN -Wall -Wextra -std=gnu11 -D_GNU_SOURCE -I../include -I../src" \
          LDFLAGS="$TSAN" \
          make -C tests build/unit/test_rx_ring
          TSAN_OPTIONS="halt_on_error=1" timeout 120 ./tests/build/unit/test_rx_ring

  # Fuzz the frame decoders (COBS/SLIP/HDLC/LENPFX) — untrusted device bytes into
  # a fixed buffer, exactly where the ZT-021/ZT-022-class bugs live. A short
  # coverage-guided run on every PR; a crash/leak/UB fails the job.
  fuzz:
    name: linux / clang / libfuzzer (framing)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 2
      - name: Install build deps
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential clang
      - name: Fuzz proto/framing decoders (30s)
        timeout-minutes: 3
        run: CC=clang FUZZ_SECONDS=30 make fuzz

  # Coverage ratchet: rebuild the embed archive + tests under gcc --coverage,
  # run the suite, aggregate src/ line coverage with gcov, and fail below the
  # COVERAGE_MIN floor so a change that guts a tested path can't slip through.
  coverage:
    name: linux / gcc / coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 2
      - name: Install build deps
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential
      - name: Coverage gate
        timeout-minutes: 6
        run: make coverage

